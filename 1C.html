<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linea 1C - BM Driver Aid</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #FF5900;
      margin: 0;
      padding: 10px; /* migliora la resa mobile */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Barra superiore */
    .top-bar {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Bottone Indietro */
   .back-box {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 2px solid #000;
  border-radius: 8px;
  cursor: pointer;
  color: #000;
  font-weight: bold;
  background: #fff;
  transition: 0.2s;
  font-size: 15px;
  width: auto;              /* evita l'allargamento su PC */
  max-width: fit-content;   /* mantiene proporzione */
}

    .back-box:hover {
      background: #eaeaea;
    }

    .back-box svg {
  width: 18px;
  height: 18px;
  stroke: #000;
}

    .top-bar h2 {
      margin: 0 auto;
      font-size: 22px;
      color: #000000;
      text-align: center;
    }

    .line-container {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 40px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .line-title {
      font-size: 22px;
      margin: 0;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-align: center;
      flex-wrap: wrap; /* migliora la resa mobile */
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border: 2px solid #000;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      background: #fff;
      color: #000;
    }

    .main-hr {
      border: none;
      border-top: 2px solid #000;
      margin: 20px 0 30px 0;
    }

    .schema-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      overflow-x: auto; /* evita overflow su mobile */
    }

    svg {
      width: 450px;
      max-width: 100%; /* scala su mobile */
      height: auto;
    }

    h4 {
      margin: 20px 0 10px 0;
      font-size: 18px;
      color: #000;
      text-align: center;
    }

    .block-hr {
      border: none;
      border-top: 2px solid #000;
      margin: 15px 0 25px 0;
    }

    /* 📱 Ottimizzazione Mobile */
    @media (max-width: 600px) {

      .top-bar {
        padding: 15px;
      }

      .top-bar h2 {
        font-size: 18px;
      }

      .back-box {
        padding: 5px 8px;
        font-size: 14px;
      }

      .line-container {
        padding: 20px;
      }

      .line-title {
        font-size: 18px;
      }

      .badge {
        padding: 3px 8px;
        font-size: 14px;
      }

      h4 {
        font-size: 16px;
      }

      svg {
        width: 100%;
        transform: scale(0.9); /* riduce altezza percepita */
        transform-origin: top center;
      }
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BM Driver Aid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #FF5900;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      max-width: 100%;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #FF5900;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #f39c12;
    }

    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 25px;
      }

      .login-box h2 {
        font-size: 20px;
      }

      .login-box h5 {
        font-size: 14px;
      }

      .login-box input {
        padding: 12px;
        font-size: 15px;
      }

      .login-box button {
        padding: 12px;
        font-size: 15px;
      }

      svg {
        width: 40px;
        height: 40px;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="login-box">

    <svg width="50" height="50" viewBox="0 0 24 24" fill="none"
         stroke="#FF5900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="margin-bottom: 15px;">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <h2>Bike Mobility</h2>
    <h5>Effettua l'accesso per visitare Driver Aid</h5>

    <input id="user" type="text" placeholder="ID Utente">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Accedi</button>
    <div id="error" class="error">Credenziali errate</div>
  </div>

  <!-- 🔐 LOGIN -->
  <script src="auth.js"></script>

  <script>
    function login() {
      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value.trim();

      if (checkLogin(u, p)) {
        window.location.href = "home.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>

</body>
</html>
